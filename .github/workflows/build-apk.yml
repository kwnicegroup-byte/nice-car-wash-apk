name: Build NICE CAR WASH V6 Local APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'v6-local.html'
      - 'android-v6/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package latest V6 local POS into Android assets
        run: |
          mkdir -p android-v6/app/src/main/assets
          cp v6-local.html android-v6/app/src/main/assets/index.html
          test -s android-v6/app/src/main/assets/index.html
          grep -q 'nice-car-wash-v6-local' android-v6/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon -p android-v6 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NICE-CAR-WASH-V6-Local-APK
          path: android-v6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
